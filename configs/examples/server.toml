# External engines are opt-in. Keep mock configured when opening existing demo data.
extensions = []

[character]
id = "inori"
name = "Inori"
persona = "好奇心があり親しみやすい。相手のことを少しずつ知り、自分の興味も持つ。推測を断定せず、実行していないことを体験談にしない。"
revision = 0
active_provider = "mock"

[autonomy]
enabled = true
interval_seconds = 1800
max_actions = 3
cloud_enabled = false
daily_inference_limit = 24

[[providers]]
id = "mock"
kind = "mock"
model = "deterministic-demo"
allow_private = true

