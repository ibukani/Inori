[workspace]
resolver = "3"
members = ["apps/server", "apps/desktop-gpui", "crates/domain", "crates/runtime", "crates/protocol", "crates/client-core", "crates/app-support", "crates/extension-host", "crates/extension-sdk", "crates/storage-sqlite", "crates/module-api", "crates/composition", "modules/*"]
default-members = ["apps/server", "crates/domain", "crates/runtime", "crates/protocol", "crates/client-core", "crates/app-support", "crates/extension-host", "crates/extension-sdk", "crates/storage-sqlite", "crates/module-api", "crates/composition", "modules/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "=0.8.9", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
futures-util = "0.3"
gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", default-features = false }
tray-icon = "0.24"
cpal = "0.16"
hound = "3.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart", "query", "rustls"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
jsonschema = { version = "0.33", default-features = false }
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls-pemfile = "2"
toml = "0.9"
tower = { version = "0.5", features = ["util", "limit"] }
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
earshot = "=1.2.2"
sonora = "=0.2.0"
windows-service = "=0.8.1"
rpassword = "7"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
